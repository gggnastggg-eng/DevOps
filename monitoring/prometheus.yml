global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-uptime-kuma
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://uptime-kuma:3001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: mariadb
    static_configs:
      # MariaDB status is checked via container health/status metrics from cAdvisor.
      # Add mysqld_exporter with credentials if deeper SQL metrics are required.
      - targets: ["cadvisor:8080"]
