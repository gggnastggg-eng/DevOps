services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kuma-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [monitoring, app]
    depends_on: [cadvisor, node-exporter, blackbox-exporter]

  grafana:
    image: grafana/grafana:12.1.1
    container_name: kuma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [monitoring]
    depends_on: [prometheus]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: kuma-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    ports: ["8088:8080"]
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: kuma-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/"]
    ports: ["9100:9100"]
    networks: [monitoring]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: kuma-blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports: ["9115:9115"]
    networks: [monitoring, app]

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    name: kuma-monitoring
  app:
    external: true
    name: kuma-app
