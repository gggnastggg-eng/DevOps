global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend mariadb_frontend
    bind *:3306
    default_backend mariadb_nodes

backend mariadb_nodes
    balance roundrobin
    option tcp-check
    server galera1 galera1:3306 check init-addr libc,none
    server galera2 galera2:3306 check init-addr libc,none
    server galera3 galera3:3306 check init-addr libc,none

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
